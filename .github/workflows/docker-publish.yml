name: Backend CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: haidarsh/backend-app
  DEPLOY_DIR: /home/hussein/deploy
  SERVICE_NAME: backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        id: deploy                        # <-- give the step an id to read its outcome
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_DIR }}"
            docker compose pull "${{ env.SERVICE_NAME }}"
            docker compose up -d --no-deps "${{ env.SERVICE_NAME }}"
            
            # Create storage link for file uploads
            echo "Creating storage link for file uploads..."
            docker compose exec "${{ env.SERVICE_NAME }}" php artisan storage:link --force
            
            echo "Running digest:"
            docker inspect -f '{{.Image}}' "${{ env.SERVICE_NAME }}" | xargs docker image inspect -f '{{index .RepoDigests 0}}'
            docker image prune -f

      # ---- Notifications (step-level, outcome-based) ----
      - name: Email (success)
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}   # e.g. smtp.gmail.com
          server_port: ${{ secrets.SMTP_PORT }}        # 587 (STARTTLS) or 465 (SSL)
          secure: ${{ secrets.SMTP_PORT == '465' }}    # false for 587, true for 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "✅ Deploy succeeded • ${{ github.repository }} • ${{ env.SERVICE_NAME }} • ${{ github.ref_name }}"
          html_body: |
            <h3>Deploy Succeeded</h3>
            <p><b>Repo:</b> ${{ github.repository }}</p>
            <p><b>Service:</b> ${{ env.SERVICE_NAME }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> <code>${{ github.sha }}</code> by ${{ github.actor }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow logs</a></p>

      - name: Email (failure)
        if: ${{ always() && steps.deploy.outcome == 'failure' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_PORT == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "❌ Deploy failed • ${{ github.repository }} • ${{ env.SERVICE_NAME }} • ${{ github.ref_name }}"
          html_body: |
            <h3>Deploy Failed</h3>
            <p><b>Repo:</b> ${{ github.repository }}</p>
            <p><b>Service:</b> ${{ env.SERVICE_NAME }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> <code>${{ github.sha }}</code> by ${{ github.actor }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow logs</a></p>
