name: Deploy backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          # Write the private key EXACTLY as stored (multiline) in the secret
          printf "%s" "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust host key to avoid interactive prompt
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Sanity check the key is readable by ssh
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${SERVER_USER}@${SERVER_HOST}" <<'EOSSH'
            set -euo pipefail
            cd /home/hussein/deploy
            echo "Pulling latest backend image…"
            docker compose pull backend
            echo "Recreating backend container…"
            docker compose up -d --no-deps backend
            echo "Running Laravel maintenance & migrations…"
            docker compose exec -T backend php artisan down || true
            docker compose exec -T backend php artisan config:cache || true
            docker compose exec -T backend php artisan route:cache || true
            docker compose exec -T backend php artisan migrate --force
            docker compose exec -T backend php artisan up || true
            echo "Backend deploy finished."
          EOSSH
