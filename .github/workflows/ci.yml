name: Backend CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: inventory_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 2004
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'   # adjust to your Laravel version
          extensions: mbstring, bcmath, pdo_pgsql

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader

      - name: Copy .env example
        run: cp .env.example .env

      - name: Configure environment for PostgreSQL
        run: |
          php -v
          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=inventory_system" >> .env
          echo "DB_USERNAME=postgres" >> .env
          echo "DB_PASSWORD=2004" >> .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Verify artisan
        run: php artisan --version

      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: inventory_system
          DB_USERNAME: postgres
          DB_PASSWORD: 2004
        run: php artisan config:clear && php artisan migrate --force --no-interaction