services:
  php:
    build: .
    container_name: laravel_php
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    container_name: laravel_nginx
    depends_on:
      - php
    ports:
      - "8000:80"   # visit http://localhost:8000
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

  db:
    image: postgres:16-alpine
    container_name: laravel_db
    environment:
      POSTGRES_DB: inventory_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2004"
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # optional for connecting from host tools
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  dbdata:
