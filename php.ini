; Project PHP settings (upload limits for customer/supplier/item attachments)
; Used by Docker (php -c /var/www) and by "composer run serve" when run from backend root.
; For "composer run dev" / plain "php artisan serve", use: php -c . artisan serve
; so this file is loaded, or set these in your system/Herd php.ini.

post_max_size = 32M
upload_max_filesize = 20M
